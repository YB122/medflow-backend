services:
  mongo:
    image: mongo:7
    container_name: medflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - medflow-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: medflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: medflow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  medflow-mongo-data:
